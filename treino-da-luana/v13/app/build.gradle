plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def signingPropertiesFile = rootProject.file('signing.properties')
def signingProperties = new Properties()
if (signingPropertiesFile.exists()) {
    signingProperties.load(new FileInputStream(signingPropertiesFile))
}

android {
    namespace 'com.luanarabelo.treinodaluana.v12'
    compileSdk 36
    buildToolsVersion '36.0.0'

    // As imagens são compartilhadas com a V12 para evitar duas cópias idênticas
    // no repositório. Elas continuam empacotadas no APK e funcionam offline.
    sourceSets {
        main.assets.srcDirs = ['../../v12/app/src/main/assets']
        main.res.srcDirs = ['../../v12/app/src/main/res']
    }

    signingConfigs {
        sharedTest {
            if (signingPropertiesFile.exists()) {
                storeFile rootProject.file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId 'com.luanarabelo.treinodaluana.v12'
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName '13.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.xiaomitest'
            versionNameSuffix '-samsung-sync'
            if (signingPropertiesFile.exists()) {
                signingConfig signingConfigs.sharedTest
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.health.connect:connect-client:1.1.0'
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
