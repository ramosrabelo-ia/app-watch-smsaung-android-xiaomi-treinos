name: Build Treino da Luana v7

on:
  push:
    branches:
      - main
    paths:
      - 'treino-da-luana/v7/**'
      - '.github/workflows/build-treino-da-luana-v7.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: treino-da-luana/v7
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp treino-da-luana/v7/app/build/outputs/apk/debug/app-debug.apk Treino-da-Luana-v7.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Treino-da-Luana-v7
          path: Treino-da-Luana-v7.apk
          if-no-files-found: error
