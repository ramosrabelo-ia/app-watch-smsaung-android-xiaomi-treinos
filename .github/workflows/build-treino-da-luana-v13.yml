name: Build Android + Galaxy Watch8

on:
  push:
    branches: [main, "v13-**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build phone and watch
        working-directory: treino-da-luana/v13
        run: gradle :app:assembleDebug :wear:assembleDebug --stacktrace

      - name: Upload Xiaomi APK
        uses: actions/upload-artifact@v4
        with:
          name: treino-luana-v13-mobile
          path: treino-da-luana/v13/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Galaxy Watch8 APK
        uses: actions/upload-artifact@v4
        with:
          name: treino-luana-v13-watch8
          path: treino-da-luana/v13/wear/build/outputs/apk/debug/wear-debug.apk
          if-no-files-found: error
