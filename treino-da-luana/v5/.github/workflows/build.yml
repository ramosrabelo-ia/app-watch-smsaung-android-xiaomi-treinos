name: Build Treino da Luana v5

on:
  push:
    branches:
      - treino-da-luana-v5
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build debug APK
        working-directory: treino-da-luana-v5
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp treino-da-luana-v5/app/build/outputs/apk/debug/app-debug.apk Treino-da-Luana-v5.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Treino-da-Luana-v5
          path: Treino-da-Luana-v5.apk
          if-no-files-found: error
