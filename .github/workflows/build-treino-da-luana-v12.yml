name: Build Treino da Luana v12

on:
  push:
    branches: [main]
    paths:
      - 'treino-da-luana/v12/**'
      - '.github/workflows/build-treino-da-luana-v12.yml'
  pull_request:
    branches: [main]
    paths:
      - 'treino-da-luana/v12/**'
      - '.github/workflows/build-treino-da-luana-v12.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK da V12
        working-directory: treino-da-luana/v12
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Publicar APK privado
        uses: actions/upload-artifact@v4
        with:
          name: Treino-da-Luana-v12
          path: treino-da-luana/v12/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
