plugins {
    id 'com.android.application'
}

android {
    namespace 'com.luanarabelo.treinodaluana.v10'
    compileSdk 35

    defaultConfig {
        applicationId 'com.luanarabelo.treinodaluana.v10'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '10.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
