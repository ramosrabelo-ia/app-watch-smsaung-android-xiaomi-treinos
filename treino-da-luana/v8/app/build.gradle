plugins {
    id 'com.android.application'
}

android {
    namespace 'com.luanarabelo.treinodaluana.v8'
    compileSdk 35

    defaultConfig {
        applicationId 'com.luanarabelo.treinodaluana.v8'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '8.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
